<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WikiExplorer Search App</title>
    <!-- Bootstrap css -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <!-- linked to css style file -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      class="container h-50 overflow-y: auto d-flex justify-content-center align-items-center mt-4 p-4 flex-column"
    >
      <div>
        <h1 class="text-center mb-3">WikiExplorer Search App</h1>
      </div>
      <div class="d-flex">
        <input
          type="text"
          size="30"
          class="input-field"
          placeholder="Type to search.."
        />
        <button
          type="button"
          class="search-button btn btn-secondary ms-1 rounded-pill"
        >
          Search
        </button>
      </div>
      <div class="output">
        <!-- display content through JavaScript dynamically here -->
      </div>
    </div>

    <!-- linked to Bootstrap JavaScript file -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <!-- link to JavaScript file -->
    <script src="index.js"></script>
  </body>
</html>
